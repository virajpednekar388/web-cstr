{% extends "base.html" %}
{% block title %}Trends{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/trends.css') }}">

<div class="trends-container">
  <div class="trends-top">
    <div>
      <h2 class="trends-title">Trends</h2>
      <div class="trends-sub">Real PLC trends (Temperature + Pressure)</div>
    </div>

    <div class="trends-controls">
      <select id="rangeSelect" class="select">
        <option value="1">Last 1 min</option>
        <option value="5">Last 5 min</option>
        <option value="15">Last 15 min</option>
        <option value="30">Last 30 min</option>
        <option value="60" selected>Last 60 min</option>
        <option value="180">Last 3 hours</option>
        <option value="360">Last 6 hours</option>
        <option value="720">Last 12 hours</option>
        <option value="1440">Last 24 hours</option>
      </select>

      <button id="pauseBtn" class="btn">Pause</button>
      <button id="liveBtn" class="btn primary">Live</button>
    </div>
  </div>

  <div class="chart-card">
    <div id="trendChart"></div>
  </div>

  <div class="hint">Zoom: drag. Reset: double click.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{{ url_for('static', filename='js/trends.js') }}"></script>
{% endblock %}

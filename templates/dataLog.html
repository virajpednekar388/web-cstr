{% extends "base.html" %}
{% block title %}Data Log{% endblock %}
{% block content %}

<style>
/* --- Industrial dark background --- */
body {
    background: linear-gradient(135deg, #0d1117, #1a1a1a);
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e0e0e0;
    margin: 0;
    padding: 0;
}

/* Page title */
h2 {
    text-align: center;
    color: #181a1a;
    margin: 25px 0;
    text-shadow: 0 0 8px #00ffd5, 0 0 15px #00a3a3;
    letter-spacing: 1px;
}

/* Control buttons */
.controls {
    text-align: center;
    margin: 15px 0 25px 0;
}

.controls button {
    background: linear-gradient(135deg, #1a1a1a, #333333);
    color: #00ffd5;
    border: 1px solid #00ffd5;
    border-radius: 6px;
    padding: 10px 20px;
    margin: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 0 8px rgba(0, 255, 213, 0.4);
    transition: all 0.2s ease-in-out;
}

.controls button:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 0 20px #00ffd5, 0 0 30px rgba(0,255,213,0.2) inset;
    background: linear-gradient(135deg, #00ffd5, #00a3a3);
    color: #111;
}

/* Table styling */
table {
    width: 90%;
    margin: auto;
    border-collapse: collapse;
    background: rgba(25, 25, 25, 0.85);
    border: 1px solid #00ffd5;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0,255,213,0.2);
}

thead {
    background: linear-gradient(135deg, #0078d7, #00b7ff);
    color: white;
    text-shadow: 0 0 5px rgba(0,0,0,0.3);
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    transition: background 0.2s ease, transform 0.2s ease;
}

tr:hover {
    background: rgba(0, 255, 213, 0.1);
    transform: scale(1.01);
}

/* Footer */
.footer {
    text-align: center;
    margin: 25px;
    color: #aaa;
    font-size: 13px;
    text-shadow: 0 0 3px #000;
}
</style>

<h2>📊 Process Data Log</h2>

<div class="controls">
  <button onclick="loadData('1min')">Last 1 Min</button>
  <button onclick="loadData('1h')">Last 1 Hour</button>
  <button onclick="loadData('all')">All Data</button>
  <button onclick="refreshData()">🔄 Refresh</button>
  <button onclick="downloadCSV()">⬇️ Download CSV</button>
</div>

<table id="dataTable">
  <thead>
    <tr><th>Timestamp</th><th>Temperature (°C)</th><th>Pressure (bar)</th></tr>
  </thead>
  <tbody>
    <tr><td colspan="3">Loading data...</td></tr>
  </tbody>
</table>


<script>
function loadData(duration) {
  fetch(`/historian?duration=${duration}`)
    .then(res => res.json())
    .then(data => {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";
      if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3'>No data available</td></tr>";
        return;
      }
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.timestamp}</td>
                        <td>${row.temperature.toFixed(2)}</td>
                        <td>${row.pressure.toFixed(2)}</td>`;
        tbody.appendChild(tr);
      });
    });
}

function refreshData() { loadData("1h"); }
function downloadCSV() { window.location.href = "/download_csv"; }
document.addEventListener("DOMContentLoaded", () => loadData("1h"));
</script>

{% endblock %}
